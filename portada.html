<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAC San Diego Sur</title>
<style>
:root{--navy:#1A2F5A;--red:#E63946;--orange:#F4A522;--green:#7CB342;--blue:#2BA9E0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden}
.portada{height:100vh;background:linear-gradient(135deg,var(--navy) 0%,#24406e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bar-top{position:absolute;top:0;left:0;width:100%;height:8px;display:flex}
.bar-top span{flex:1}
.logo-box{background:#fff;border-radius:28px;padding:40px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .8s ease}
.logo-box img{width:220px;display:block}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
h1{color:#fff;font-family:Georgia,serif;font-size:clamp(1.6rem,7.5vw,2.2rem);margin-top:36px;letter-spacing:.02em;text-align:center;padding:0 24px;line-height:1.2}
p{color:#b9c6e0;margin-top:12px;font-size:clamp(.85rem,3.4vw,1.05rem);letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:0 20px}
.enter{margin-top:40px;background:var(--orange);color:var(--navy);padding:16px 44px;border-radius:10px;font-weight:700;font-size:1.05rem;text-decoration:none;transition:transform .2s;display:inline-flex;align-items:center;gap:10px}
.enter:hover{transform:translateY(-3px)}
.deco{position:absolute;border-radius:50%;opacity:.06;background:#fff}
.d1{width:300px;height:300px;top:-100px;right:-80px}
.d2{width:200px;height:200px;bottom:-60px;left:-40px}
</style><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A2F5A">
<link rel="apple-touch-icon" href="assets/app_icon_192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JAC San Diego">
<style id="portada-fix">
/* En la portada: botón Instalar arriba a la derecha, naranja y visible (no tapa el banner) */
.pwa-install{top:18px;right:18px;bottom:auto !important;background:var(--orange) !important;color:var(--navy) !important;box-shadow:0 8px 22px rgba(0,0,0,.35)}
</style>
<style id="mobile-fix">
@media(max-width:900px){
  nav.menu{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:56px}
  body.menu-open .pwa-install,body.menu-open .wa-float{display:none !important}
  /* Submenús siempre visibles y ordenados dentro del menú móvil */
  nav.menu .has-dd{flex-direction:column;align-items:flex-start;width:100%;gap:6px}
  nav.menu .has-dd>a{width:100%}
  nav.menu .has-dd .dd{position:static !important;transform:none !important;opacity:1 !important;visibility:visible !important;box-shadow:none;border:none;border-left:2px solid var(--line);border-radius:0;padding:2px 0 2px 16px;margin:2px 0 2px 2px;min-width:0;background:transparent}
  nav.menu .has-dd .dd a{display:block;padding:9px 0;font-size:.9rem;color:#41506a}
  nav.menu .has-dd .caret{display:none}
  nav.menu a{font-size:1.02rem}
  /* que los flotantes no tapen el menú abierto */
  nav.menu.open ~ .pwa-install,nav.menu.open ~ .wa-float{display:none}
}
</style>
</head>
<body>
<div class="portada">
  <div class="bar-top"><span style="background:var(--red)"></span><span style="background:var(--orange)"></span><span style="background:var(--green)"></span><span style="background:var(--blue)"></span></div>
  <div class="deco d1"></div><div class="deco d2"></div>
  <div class="logo-box"><img src="assets/logo.jpg" alt="JAC San Diego Sur"></div>
  <h1>Junta de Acción Comunal</h1>
  <p>San Diego Sur · Medellín</p>
  <a href="r_territorio.html" class="enter">Entrar al sitio →</a>

  <div style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:90%;max-width:640px;background:rgba(255,255,255,.95);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)">
    <div style="width:48px;height:48px;border-radius:10px;background:#f3f5f9;display:flex;align-items:center;justify-content:center;color:#9aa6ba;font-size:.62rem;flex-shrink:0">[ Logo ]</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:#F4A522;font-weight:700">Espacio patrocinado</div>
      <b style="color:#1A2F5A;font-size:.92rem">[ Nombre del negocio ]</b>
    </div>
    <a href="#" style="background:#1A2F5A;color:#fff;padding:8px 16px;border-radius:7px;font-size:.8rem;text-decoration:none;font-weight:600;white-space:nowrap">Visitar</a>
  </div>
</div>
<button id="pwa-install" class="pwa-install" hidden>⬇ Instalar app</button>
<style>
.pwa-install{position:fixed;bottom:96px;right:24px;z-index:100;background:var(--navy);color:#fff;border:none;padding:12px 20px;border-radius:30px;font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 10px 26px rgba(26,47,90,.4);display:flex;align-items:center;gap:8px;transition:transform .2s,filter .2s;animation:pwaIn .4s ease}
.pwa-install:hover{transform:translateY(-3px);filter:brightness(1.08)}
@keyframes pwaIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:600px){.pwa-install{bottom:92px;right:16px;padding:11px 16px;font-size:.85rem}}
</style>
<script>
(function(){
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){} }
  var dp=null, btn=document.getElementById('pwa-install');
  var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); dp=e; if(btn) btn.hidden=false; });
  window.addEventListener('appinstalled',function(){ if(btn) btn.hidden=true; });
  if(isIOS && !standalone && btn){ btn.hidden=false; }
  if(btn){ btn.addEventListener('click',function(){
    if(dp){ dp.prompt(); dp.userChoice.then(function(){ dp=null; btn.hidden=true; }); }
    else { alert('Instalar la app de la JAC San Diego Sur:\n\n• iPhone/iPad (Safari): toca Compartir y luego “Agregar a inicio”.\n• Android/Computador (Chrome): menú ⋮ → “Instalar app”.'); }
  }); }
})();
</script>
</body></html>
